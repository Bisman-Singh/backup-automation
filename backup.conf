# Backup Automation - Configuration File
#
# SOURCE_DIRS: Comma-separated list of directories to back up
# DEST_DIR: Directory where backups will be stored
# RETENTION_DAYS: Delete backups older than this many days
# COMPRESSION: Compression type (gzip, bzip2, xz, none)
# BACKUP_PREFIX: Prefix for backup filenames

SOURCE_DIRS=/home/user/documents,/home/user/projects,/etc
DEST_DIR=/tmp/backups
RETENTION_DAYS=30
COMPRESSION=gzip
BACKUP_PREFIX=backup
